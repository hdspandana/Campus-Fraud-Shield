# .dockerignore
# Keeps the build context small and avoids baking local-only state
# (your local SQLite DB, trained model files, venvs) into the image —
# docker-compose.yml's named volumes are what should own that data at
# runtime, not whatever happened to exist on the machine that ran
# `docker build`.

.git/
.github/
__pycache__/
*.pyc
*.pyo
.pytest_cache/
.venv/
venv/
env/

# Local runtime state — volumes own this at container runtime instead.
# Matches .gitignore's own list of what's regenerated by train_model.py
# / app startup, rather than a broad glob — models/scam_classifier.pkl
# (a separate, still-referenced-by-config.py file, unclear if legacy)
# is deliberately NOT excluded here since it's unclear whether anything
# regenerates it; better to ship it than guess wrong and break startup.
data/fraud_shield.db
models/semantic_classifier.pkl
models/training_embeddings.npy
models/training_texts.json
data/model_metrics.json
data/baseline_ablation_results.json
data/engine_scores_cache.json
data/weight_threshold_sweep_results.json
data/full_pipeline_eval_results.json
data/scam_dataset_augmented.csv

# Editor/OS cruft
.vscode/
.idea/
.DS_Store

# Docs/build artifacts not needed inside the image
docs/
*.md
!README.md